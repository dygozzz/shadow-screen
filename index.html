<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow Screen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='8' width='60' height='48' rx='12' fill='%2312141a'/%3E%3Crect x='10' y='17' width='44' height='26' rx='4' fill='%238b7bff'/%3E%3Crect x='16' y='23' width='8' height='8' fill='%230b0820'/%3E%3Crect x='28' y='29' width='8' height='8' fill='%230b0820'/%3E%3Crect x='40' y='23' width='8' height='8' fill='%230b0820'/%3E%3C/svg%3E">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try { const th = localStorage.getItem("ss-theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch {}
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0b0e;
    --bg-glow: #1a1640;
    --panel: #12141a;
    --panel-2: #191c24;
    --line: #262a35;
    --hover-line: #3a3f4d;
    --hover-bg: rgba(255, 255, 255, .07);
    --text: #e8eaf0;
    --muted: #8a90a0;
    --accent: #8b7bff;
    --accent-2: #b3a8ff;
    --on-accent: #0b0820;
    --seg-on: #2a2650;
    --sel-bg: #1d1a38;
    --sel-line: #3a3270;
    --drop-a: #0c0d11;
    --drop-b: #0e1015;
    --drop-line: #2c3140;
    --titlebar: rgba(14, 15, 20, .62);
    --shadow: rgba(139, 123, 255, .35);
    --ok: #3ddc97;
    --warn: #ffb547;
    --err: #ff5d6c;
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f3f4f8; --bg-glow: #e4ddff; --panel: #ffffff; --panel-2: #f1f2f6; --line: #dfe2ea;
      --hover-line: #c4c9d6; --hover-bg: rgba(0, 0, 0, .06); --text: #171a21; --muted: #5f6676;
      --accent: #6b5bff; --accent-2: #5646f0; --on-accent: #ffffff; --seg-on: #e6e1ff; --sel-bg: #f0edff;
      --sel-line: #cfc7ff; --drop-a: #e9ebf1; --drop-b: #e3e6ed; --drop-line: #c9cdd8;
      --titlebar: rgba(255, 255, 255, .62); --shadow: rgba(107, 91, 255, .22);
      --ok: #12a36a; --warn: #b86e00; --err: #d93848;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f3f4f8; --bg-glow: #e4ddff; --panel: #ffffff; --panel-2: #f1f2f6; --line: #dfe2ea;
    --hover-line: #c4c9d6; --hover-bg: rgba(0, 0, 0, .06); --text: #171a21; --muted: #5f6676;
    --accent: #6b5bff; --accent-2: #5646f0; --on-accent: #ffffff; --seg-on: #e6e1ff; --sel-bg: #f0edff;
    --sel-line: #cfc7ff; --drop-a: #e9ebf1; --drop-b: #e3e6ed; --drop-line: #c9cdd8;
    --titlebar: rgba(255, 255, 255, .62); --shadow: rgba(107, 91, 255, .22);
    --ok: #12a36a; --warn: #b86e00; --err: #d93848;
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { scrollbar-width: thin; scrollbar-color: var(--hover-line) transparent; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, var(--bg-glow) 0%, transparent 60%), var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", Roboto, sans-serif;
  }
  button, input, select { font: inherit; color: inherit; }

  /* Title bar (doubles as the frameless window's title bar inside the desktop app) */
  header {
    position: sticky; top: 0; z-index: 30; height: 58px;
    display: flex; align-items: center; gap: 12px; padding: 0 10px 0 22px;
    background: var(--titlebar); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: .2px; white-space: nowrap; }
  .brand .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
  .brand small { font-weight: 500; color: var(--muted); font-size: 12.5px; }
  .spacer { flex: 1; align-self: stretch; }
  .tools { display: flex; align-items: center; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.on { color: var(--text); cursor: default; }
  .pill.on i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .iconbtn {
    width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel-2); cursor: pointer; color: var(--muted);
  }
  .iconbtn:hover { color: var(--text); border-color: var(--hover-line); }
  .iconbtn svg { width: 18px; height: 18px; }
  .lang {
    height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 0 8px; cursor: pointer;
  }
  .winctl { display: none; gap: 4px; margin-left: 6px; padding-left: 10px; border-left: 1px solid var(--line); }
  body.native .winctl { display: flex; }
  .winctl button {
    width: 48px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 10px;
    background: transparent; color: var(--muted); cursor: pointer; transition: background .12s, color .12s;
  }
  .winctl button:hover { background: var(--hover-bg); color: var(--text); }
  .winctl button.close:hover { background: #e5484d; color: #fff; }
  .winctl svg { width: 16px; height: 16px; }

  .btn {
    border: 1px solid var(--line); background: var(--panel-2); padding: 8px 14px; border-radius: 10px;
    cursor: pointer; transition: border-color .15s, background .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--hover-line); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 650; }
  .btn.primary:hover { background: var(--accent-2); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.small { padding: 5px 10px; font-size: 13px; }

  /* App layout: fixed title bar, preview fills the left, only the tools column scrolls */
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { flex: none; }
  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 24px;
    padding: 20px 0 0 28px;
  }
  .panel { overflow-y: auto; min-height: 0; padding: 0 20px 24px 2px; scrollbar-width: thin; scrollbar-color: var(--hover-line) transparent; }
  @media (max-width: 1000px) {
    body { height: auto; overflow: auto; }
    main { grid-template-columns: 1fr; padding: 20px 16px 24px; }
    .panel { overflow: visible; padding: 0; }
    .view { height: 56vw; }
  }

  /* Stage */
  .stage { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; padding-bottom: 20px; }
  .view { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
  .bezel {
    width: min(100cqw, calc((100cqh - 36px) * var(--ar, 1.7778) + 36px));
    position: relative; padding: 18px; border-radius: 22px;
    background: linear-gradient(180deg, #1b1e27, #0f1116);
    border: 1px solid #262a35;
    box-shadow: 0 30px 80px -30px var(--shadow), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .screen {
    position: relative; width: 100%; aspect-ratio: var(--ar, 1.7778); border-radius: 8px; overflow: hidden;
    background: #000; outline: 1px solid #000;
  }
  .screen canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: grab; touch-action: none; }
  .screen canvas.dragging { cursor: grabbing; }
  .screen.full canvas { cursor: default; }
  .drop {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    color: #8a90a0; border: 2px dashed #2c3140; border-radius: 8px; cursor: pointer;
    background: repeating-linear-gradient(45deg, #0c0d11 0 12px, #0e1015 12px 24px);
  }
  .drop b { display: block; color: #e8eaf0; font-size: 18px; margin-bottom: 4px; }
  body.dragover .bezel { border-color: var(--accent); }
  .stage-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .stage-meta kbd { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font: 12px ui-monospace, monospace; color: var(--text); }

  .strip-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 650; }
  .strip { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: thin; flex: none; min-height: 50px; }
  .strip canvas {
    flex: 0 0 auto; width: 64px; height: 36px; border-radius: 4px; outline: 1px solid var(--line);
    image-rendering: pixelated; opacity: .45; cursor: pointer;
  }
  .strip canvas.mine { opacity: .85; }
  .strip canvas.cur { outline: 2px solid var(--accent); opacity: 1; }
  .strip canvas.over { outline-color: var(--err); }

  /* Panel */
  .panel { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .card h3 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650; display: flex; justify-content: space-between; align-items: center; }
  .card h3 .btn { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--text); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
  .row label { color: var(--muted); }
  .val { font-variant-numeric: tabular-nums; color: var(--text); min-width: 64px; text-align: right; }

  .queue { display: flex; flex-direction: column; gap: 6px; }
  .qitem {
    display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center;
    padding: 6px; border-radius: 10px; border: 1px solid transparent; cursor: pointer;
  }
  .qitem:hover { background: var(--panel-2); }
  .qitem.sel { background: var(--sel-bg); border-color: var(--sel-line); }
  .qitem canvas { width: 64px; height: 36px; border-radius: 4px; outline: 1px solid var(--line); image-rendering: pixelated; }
  .qitem .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 13.5px; }
  .qitem .sub { color: var(--muted); font-size: 12px; }
  .qitem .acts { display: flex; gap: 2px; }
  .qitem .acts button { border: 0; background: transparent; color: var(--muted); width: 26px; height: 26px; border-radius: 6px; cursor: pointer; }
  .qitem .acts button:hover { background: var(--hover-bg); color: var(--text); }
  .qempty { color: var(--muted); font-size: 13px; padding: 6px 2px; }
  .budget { margin-top: 12px; }
  .budget .top { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; }
  .budget .top b { color: var(--text); font-variant-numeric: tabular-nums; }
  .budget.over .top b { color: var(--err); }
  .budget .meter { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .budget .meter i { display: block; height: 100%; background: var(--accent); transition: width .15s; }
  .budget.over .meter i { background: var(--err); }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; width: 100%; }
  .seg button { border: 0; background: transparent; padding: 7px 6px; border-radius: 7px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--seg-on); color: var(--text); }

  input[type=range] { width: 100%; accent-color: var(--accent); }
  .slider { margin-top: 10px; }
  .slider .top { display: flex; justify-content: space-between; color: var(--muted); }
  .dual { position: relative; height: 22px; }
  .dual input { position: absolute; inset: 0; pointer-events: none; background: none; -webkit-appearance: none; appearance: none; }
  .dual input::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); cursor: pointer; }
  .dual .track { position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--line); }
  .dual .fill { position: absolute; top: 9px; height: 4px; border-radius: 2px; background: var(--accent); }
  .num { width: 84px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; text-align: right; }
  .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted); }
  .check input { accent-color: var(--accent); }
  .toggles { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--muted); }
  .chip.on { border-color: var(--accent); color: var(--text); }
  input[type=color] { width: 34px; height: 26px; border: 1px solid var(--line); border-radius: 6px; background: none; padding: 0; cursor: pointer; }
  .hide { display: none !important; }
  .disabled { opacity: .4; pointer-events: none; }

  .send .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .send .summary div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .send .summary span { display: block; color: var(--muted); font-size: 12px; }
  .send .summary b { font-variant-numeric: tabular-nums; font-size: 15px; }
  .send .btn.primary { width: 100%; padding: 12px; font-size: 15px; }
  .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 12px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .15s; }
  .status { margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 1.45em; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .status.warn { color: var(--warn); }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .note.err { color: var(--err); }

  /* Connect modal (sits under the title bar so the window stays movable/closable) */
  .modal-back {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 74px 16px 16px;
    background: color-mix(in srgb, var(--bg) 70%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: opacity .3s;
  }
  .modal-back.fading { opacity: 0; pointer-events: none; }
  .modal {
    width: min(460px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    padding: 28px 28px 22px; text-align: center; box-shadow: 0 40px 120px -20px var(--shadow);
  }
  .modal h2 { margin: 0 0 6px; font-size: 20px; }
  .modal p { margin: 0; color: var(--muted); }
  .kb { width: 230px; height: auto; display: block; margin: 0 auto 18px; }
  .kb-body { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.5; }
  .kb-key { fill: var(--line); }
  .kb-cable { fill: none; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 5 7; animation: dash 1s linear infinite; }
  .kb-screen { fill: var(--accent); animation: glow 2.4s ease-in-out infinite; }
  .found .kb-cable { stroke-dasharray: none; stroke: var(--ok); animation: none; }
  @keyframes dash { to { stroke-dashoffset: -24; } }
  @keyframes glow { 50% { opacity: .45; } }
  .seek {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 8px 14px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); font-size: 13px;
  }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .found .seek { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .found .spin { animation: none; border-color: var(--ok); background: var(--ok); }
  .conflict {
    margin-top: 16px; padding: 10px 12px; border-radius: 10px; text-align: left; font-size: 13px; color: var(--warn);
    background: color-mix(in srgb, var(--warn) 9%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
  }
  .modal .actions { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .ghost { background: transparent; border: 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<header id="titlebar" class="pywebview-drag-region">
  <div class="brand pywebview-drag-region"><span class="dot"></span>Shadow Screen <small id="modelInfo"></small></div>
  <div class="spacer pywebview-drag-region"></div>
  <div class="tools">
    <span class="pill" id="connPill"><i></i><span id="connText"></span></span>
    <button class="btn" id="connectBtn" data-i18n="connect"></button>
    <select class="lang" id="langSel" aria-label="Language">
      <option value="pt">PT</option>
      <option value="en">EN</option>
      <option value="zh">中文</option>
    </select>
    <button class="iconbtn" id="themeBtn"></button>
  </div>
  <div class="winctl">
    <button id="winMin" data-i18n-title="minimize">
      <svg viewBox="0 0 16 16"><path d="M3 8h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button id="winMax">
      <svg viewBox="0 0 16 16" id="winMaxIcon"><rect x="3" y="3" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button id="winClose" class="close" data-i18n-title="close">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="stage">
    <div class="view">
      <div class="bezel">
        <div class="screen" id="screenBox">
          <canvas id="screen" width="240" height="135"></canvas>
          <div class="drop" id="drop">
            <div><b data-i18n="dropTitle"></b><span data-i18n="dropSub"></span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="stage-meta">
      <button class="chip" id="fullBtn" data-i18n="fullPreview"></button>
      <span data-i18n-html="hints"></span>
    </div>
    <div class="strip-head"><span data-i18n="stripTitle"></span><span id="stripCount"></span></div>
    <div class="strip" id="strip"></div>
  </section>

  <aside class="panel">
    <div class="card">
      <h3><span data-i18n="queue"></span> <button class="btn small" id="addBtn" data-i18n="add"></button></h3>
      <div class="queue" id="queue"></div>
      <input type="file" id="fileInput" multiple accept="image/gif,image/webp,image/png,image/jpeg,image/apng" hidden>
      <div class="budget" id="budget">
        <div class="top"><span data-i18n="memory"></span><b id="budgetVal"></b></div>
        <div class="meter"><i id="budgetFill" style="width:0"></i></div>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="autoIv" checked> <span data-i18n="autoIv"></span></label>
        <span><input class="num" type="number" id="interval" min="10" max="60000" step="10" value="100"> ms</span>
      </div>
      <div class="note" id="ivNote"></div>
    </div>

    <div class="card" id="editCard">
      <h3 data-i18n="selected"></h3>
      <div class="seg" id="fitSeg">
        <button data-v="cover" class="on" data-i18n="cover"></button>
        <button data-v="contain" data-i18n="contain"></button>
        <button data-v="stretch" data-i18n="stretch"></button>
      </div>
      <div class="slider">
        <div class="top"><label for="zoom" data-i18n="zoom"></label><span class="val" id="zoomVal">100%</span></div>
        <input type="range" id="zoom" min="50" max="400" value="100">
      </div>
      <div class="row" id="bgRow">
        <label data-i18n="background"></label>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="seg" id="bgSeg" style="width:auto">
            <button data-v="blur" class="on" data-i18n="blur"></button>
            <button data-v="color" data-i18n="color"></button>
          </div>
          <input type="color" id="bgColor" value="#000000">
        </div>
      </div>
      <div class="toggles">
        <button class="chip" id="flipBtn" data-i18n="mirror"></button>
        <button class="chip" id="rotBtn" data-i18n="rotate"></button>
        <button class="chip" id="centerBtn" data-i18n="center"></button>
      </div>

      <div id="gifCtl">
        <div class="slider" style="margin-top:16px">
          <div class="top"><label for="count" data-i18n="gifFrames"></label><span class="val" id="countVal">—</span></div>
          <input type="range" id="count" min="1" max="50" value="1">

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },

let lang = store.get("ss-lang");
if (!I18N[lang]) {
  const nav = (navigator.language || "en").toLowerCase();
  lang = nav.startsWith("pt") ? "pt" : nav.startsWith("zh") ? "zh" : "en";
}

function t(key, p = {}) {
  const s = I18N[lang][key] ?? I18N.en[key] ?? key;
  return s.replace(/\{(\w+)\}/g, (_, k) => p[k] ?? "");
}

function applyI18n() {
  document.documentElement.lang = { pt: "pt-BR", en: "en", zh: "zh-CN" }[lang];
  $("langSel").value = lang;
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml);

  renderStatus();
  renderTheme();
  renderMax();
  updateConn();
  renderModal();
  structureChanged();
}

// ---------- Theme ----------
const THEMES = ["system", "light", "dark"];
let theme = THEMES.includes(store.get("ss-theme")) ? store.get("ss-theme") : "system";
const THEME_ICONS = {

function renderTheme() {
  if (theme === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;

  $("themeBtn").title = t({ system: "themeSystem", light: "themeLight", dark: "themeDark" }[theme]);

  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];

// ---------- Keyboard model ----------
// The desktop launcher reports the connected model (launcher/models/*). The browser-only
// WebHID fallback below speaks the Shadow-S protocol only.
const SHADOW_S = { id: "shadow-s", name: "EPOMAKER Shadow-S", width: 240, height: 135, maxFrames: 50, secondsPerFrame: 2.4, preview: "rgb565", minInterval: 10, maxInterval: 60000 };
let model = SHADOW_S;
let W = model.width, H = model.height, MAX_FRAMES = model.maxFrames, SECONDS_PER_FRAME = model.secondsPerFrame;
let MIN_IV = model.minInterval, MAX_IV = model.maxInterval;

// ---------- Shadow-S protocol for the WebHID fallback (see PROTOCOL.md) ----------
const FRAME_BYTES = 240 * 135 * 2, STRIDE = 0x10000, CHUNK = 56;
const VID = 0x320F, PID = 0x5055, USAGE_PAGE = 0xFF1C, REPORT_ID = 0x04;
const CMD = { BEGIN: 0x01, END: 0x02, CFG_READ: 0x05, CFG_WRITE: 0x06, DATA: 0x21, PREPARE: 0x23 };
const CFG_FRAMES = 34, CFG_CLOCK = 35, CFG_INTERVAL = 43;

function packet(cmd, len = 0, addr = 0, payload = null) {
  const p = new Uint8Array(64);
  p[0] = REPORT_ID;
  p[3] = cmd; p[4] = len;
  p[5] = addr & 0xFF; p[6] = (addr >> 8) & 0xFF; p[7] = (addr >> 16) & 0xFF;
  if (payload) p.set(payload, 8);
  let s = 0;
  for (let i = 3; i < 64; i++) s += p[i];
  p[1] = s & 0xFF; p[2] = (s >> 8) & 0xFF;
  return p;
}

const bcd = n => ((Math.floor(n / 10) << 4) | (n % 10));

function buildConfig(base, nFrames, intervalMs) {
  const cfg = new Uint8Array(base);
  const now = new Date();
  cfg[CFG_FRAMES] = nFrames;
  cfg.set([bcd(now.getSeconds()), bcd(now.getMinutes()), bcd(now.getHours()), now.getDay(),
           bcd(now.getDate()), bcd(now.getMonth() + 1), bcd(now.getFullYear() % 100)], CFG_CLOCK);
  cfg[CFG_INTERVAL] = intervalMs & 0xFF;
  cfg[CFG_INTERVAL + 1] = (intervalMs >> 8) & 0xFF;
  return cfg;
}

// ---------- Keyboard access ----------
// "local": the desktop launcher talks HID for us (/api/*). "webhid": browser-only fallback.
const hw = { mode: "webhid", connected: false, conflicts: [], unsupported: [], dismissed: false, booted: false };
let device = null, pending = null;
const isConnected = () => hw.mode === "local" ? hw.connected : !!device;

async function fetchStatus() {
  const r = await fetch("/api/status", { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function applyStatus(s) {
  const was = hw.connected;
  hw.connected = s.connected;
  hw.conflicts = s.conflicts || [];
  hw.unsupported = s.unsupported || [];
  if (s.model) setModel(s.model);
  if (was && !s.connected && !state.busy) hw.dismissed = false; // unplugged: ask again
  updateConn();
  renderModal();
}

const isScreenIface = d => d.vendorId === VID && d.productId === PID &&
  d.collections.some(c => c.usagePage === USAGE_PAGE);

function onInputReport(e) {
  if (!pending) return;
  const r = new Uint8Array(8);
  r[0] = e.reportId;
  r.set(new Uint8Array(e.data.buffer, e.data.byteOffset, Math.min(7, e.data.byteLength)), 1);
  const p = pending; pending = null;
  clearTimeout(p.timer);
  p.resolve(r);
}

function xfer(pkt, timeoutMs = 3000) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pending = null;
      reject(new Error(t("noReply", { cmd: "0x" + pkt[3].toString(16) })));
    }, timeoutMs);
    pending = { resolve, timer };
    device.sendReport(REPORT_ID, pkt.subarray(1)).catch(err => {
      clearTimeout(timer); pending = null; reject(err);
    });
  });
}

async function useDevice(d) {
  if (!d.opened) await d.open();
  d.addEventListener("inputreport", onInputReport);
  device = d;
  updateConn();
  renderModal();
}

async function connectWebHID(interactive) {
  if (!("hid" in navigator)) { setStatus("noWebhid", {}, "err"); return; }
  try {
    let d = (await navigator.hid.getDevices()).find(isScreenIface);
    if (!d && interactive) {
      const picked = await navigator.hid.requestDevice({ filters: [{ vendorId: VID, productId: PID, usagePage: USAGE_PAGE }] });
      d = picked.find(isScreenIface);
    }
    if (d) await useDevice(d);
  } catch (err) {
    setStatus("openErr", { err: err.message }, "err");
  }
}

if ("hid" in navigator) {
  navigator.hid.addEventListener("disconnect", e => {
    if (e.device === device) { device = null; if (!state.busy) hw.dismissed = false; updateConn(); renderModal(); }
  });
  navigator.hid.addEventListener("connect", e => {
    if (hw.mode === "webhid" && !device && isScreenIface(e.device)) useDevice(e.device).catch(() => {});
  });
}

// ---------- Connect modal ----------
let modalClosing = null, modalOpen = false;

function renderModal() {
  if (!hw.booted) return;
  const m = $("kbModal");
  const want = !isConnected() && !hw.dismissed;
  const apps = hw.conflicts.join(t("and"));
  $("mConflict").textContent = apps ? t("conflict", { apps }) : "";
  $("mConflict").classList.toggle("hide", !apps);
  const others = hw.unsupported.join(", ");
  $("mUnsupported").textContent = others ? t("unsupported", { names: others }) : "";
  $("mUnsupported").classList.toggle("hide", !others);
  $("mConnect").classList.toggle("hide", hw.mode !== "webhid");
  $("mSeek").classList.toggle("hide", hw.mode === "webhid");

  if (want) {
    clearTimeout(modalClosing); modalClosing = null;
    $("kbModalBox").classList.remove("found");
    $("mTitle").textContent = t("mTitle");
    $("mSub").textContent = t(hw.mode === "webhid" ? "mSubWeb" : "mSub");
    $("mSeekText").textContent = t("searching");
    m.classList.remove("hide", "fading");
    modalOpen = true;
  } else if (modalOpen && !modalClosing) {
    if (isConnected()) {
      // Celebrate briefly, then fade out.
      $("kbModalBox").classList.add("found");
      $("mTitle").textContent = t("foundTitle");
      $("mSeekText").textContent = t("found");
      $("mSeek").classList.remove("hide");
      modalClosing = setTimeout(closeModal, 900);
    } else {
      closeModal();
    }
  }
}

function closeModal() {
  const m = $("kbModal");
  m.classList.add("fading");
  setTimeout(() => { if (m.classList.contains("fading")) m.classList.add("hide"); }, 300);
  modalOpen = false; modalClosing = null;
}

$("mSkip").addEventListener("click", () => { hw.dismissed = true; renderModal(); });
$("mConnect").addEventListener("click", () => connectWebHID(true));
$("connPill").addEventListener("click", () => {
  if (isConnected()) return;
  hw.dismissed = false;
  renderModal();
});
$("connectBtn").addEventListener("click", () => connectWebHID(true));

// ---------- Window controls (desktop app only) ----------
let maximized = false;
function renderMax() {
  $("winMax").title = t(maximized ? "restore" : "maximize");
  $("winMaxIcon").innerHTML = maximized
    ? '<rect x="3" y="5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 3h5.5A1.5 1.5 0 0 1 13 4.5V10" fill="none" stroke="currentColor" stroke-width="1.4"/>'
    : '<rect x="3" y="3" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>';
}
async function toggleMax() { maximized = await window.pywebview.api.toggle_maximize(); renderMax(); }
window.addEventListener("pywebviewready", () => {
  document.body.classList.add("native");
  $("winMin").addEventListener("click", () => window.pywebview.api.minimize());
  $("winMax").addEventListener("click", toggleMax);
  $("winClose").addEventListener("click", () => window.pywebview.api.close());
  $("titlebar").addEventListener("dblclick", e => { if (!e.target.closest("button, select, .pill")) toggleMax(); });
});

// ---------- State ----------
// Item: { id, name, kind: "gif"|"image", frames: [{ bmp, dur }], starts, total, w, h,
//         fit, zoom, panX, panY, flip, rot, bg, bgColor, count, trimA, trimB, hold, sel }
const state = { queue: [], selId: null, autoIv: true, interval: 100, full: false, busy: false, seq: [] };
let nextId = 1;
const current = () => state.queue.find(it => it.id === state.selId) || null;

// ---------- Loading ----------
async function addFiles(files) {
  const list = [...files].filter(f => f.type.startsWith("image/"));
  if (!list.length) return;
  for (const file of list) {
    setStatus("reading", { name: file.name });
    try {
      const frames = await decode(file);
      if (!frames.length) throw new Error("no frames");
      const starts = []; let tt = 0;
      for (const f of frames) { starts.push(tt); tt += f.dur; }
      const item = {
        id: nextId++, name: file.name, kind: frames.length > 1 ? "gif" : "image",
        frames, starts, total: tt, w: frames[0].bmp.width, h: frames[0].bmp.height,
        fit: "cover", zoom: 1, panX: 0, panY: 0, flip: false, rot: false, bg: "blur", bgColor: "#000000",
        count: Math.min(MAX_FRAMES, frames.length), trimA: 0, trimB: 1000, hold: 5, sel: [],
      };
      state.queue.push(item);
      state.selId = item.id;
    } catch (err) {
      setStatus("readErr", { name: file.name, err: err.message }, "err");
      return structureChanged();
    }
  }
  setStatus("ready");
  structureChanged();
}

async function decode(file) {
  if ("ImageDecoder" in window && await ImageDecoder.isTypeSupported(file.type)) {
    const dec = new ImageDecoder({ data: file.stream(), type: file.type });
    await dec.tracks.ready;
    await dec.completed;
    const track = dec.tracks.selectedTrack;
    const frames = [];
    for (let i = 0; i < track.frameCount; i++) {
      const { image } = await dec.decode({ frameIndex: i });
      const dur = image.duration ? Math.max(20, image.duration / 1000) : 100;
      frames.push({ bmp: await createImageBitmap(image), dur });
      image.close();
    }
    dec.close();
    return frames;
  }
  return [{ bmp: await createImageBitmap(file), dur: 100 }];
}

// ---------- Frame selection ----------
function trimRange(it) {
  return [it.total * it.trimA / 1000, it.total * it.trimB / 1000];
}

function frameAt(it, tm) {
  const s = it.starts;
  let lo = 0, hi = s.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (s[m] <= tm) lo = m; else hi = m - 1; }
  return lo;
}

function gifSelection(it) {
  const [a, b] = trimRange(it);
  const first = frameAt(it, a), last = frameAt(it, Math.max(a, b - 0.001));
  const avail = last - first + 1;
  const n = Math.max(1, Math.min(it.count, MAX_FRAMES));
  if (n >= avail) return Array.from({ length: avail }, (_, i) => first + i);
  const span = Math.max(1, b - a);
  return Array.from({ length: n }, (_, k) => frameAt(it, a + (k + 0.5) * span / n));
}

// Interval that plays this GIF selection at its original speed.
function naturalInterval(it) {
  const [a, b] = trimRange(it);
  return Math.max(1, b - a) / gifSelection(it).length;
}

const clampIv = v => Math.max(MIN_IV, Math.min(MAX_IV, Math.round(v)));
const holdFrames = it => Math.max(1, Math.round(it.hold * 1000 / state.interval));

function recompute() {
  if (state.autoIv && state.queue.length) {
    const gif = state.queue.find(it => it.kind === "gif");
    state.interval = gif
      ? clampIv(naturalInterval(gif))
      : clampIv(Math.min(...state.queue.map(it => it.hold)) * 1000);
  }
  for (const it of state.queue) {
    it.sel = it.kind === "gif" ? gifSelection(it) : new Array(holdFrames(it)).fill(0);
  }
  state.seq = state.queue.flatMap(it => it.sel.map(fi => ({ it, fi })));
}

// ---------- Rendering ----------
let work = new OffscreenCanvas(W, H);
let wctx = work.getContext("2d", { willReadFrequently: true });
const screen = $("screen");
const sctx = screen.getContext("2d");

function renderModelInfo() {
  $("modelInfo").textContent = `${model.name} · ${W}×${H}`;
  document.documentElement.style.setProperty("--ar", W / H);
}

// Switch the whole app to another keyboard's screen size and limits.
function setModel(m) {
  if (m.id === model.id && m.width === W && m.height === H && m.maxFrames === MAX_FRAMES) return;
  model = m;
  W = m.width; H = m.height; MAX_FRAMES = m.maxFrames; SECONDS_PER_FRAME = m.secondsPerFrame;
  MIN_IV = m.minInterval ?? 10; MAX_IV = m.maxInterval ?? 60000;
  $("interval").min = MIN_IV; $("interval").max = MAX_IV;
  state.interval = clampIv(state.interval);
  screen.width = W; screen.height = H;
  work = new OffscreenCanvas(W, H);
  wctx = work.getContext("2d", { willReadFrequently: true });
  $("strip").innerHTML = "";
  for (const it of state.queue) it.count = Math.min(it.count, MAX_FRAMES);
  renderModelInfo();
  structureChanged();
}

function scales(it) {
  if (it.fit === "stretch") return [W / it.w * it.zoom, H / it.h * it.zoom];
  const base = it.fit === "cover" ? Math.max(W / it.w, H / it.h) : Math.min(W / it.w, H / it.h);
  return [base * it.zoom, base * it.zoom];
}

function clampPan(it) {
  const [sx, sy] = scales(it);
  const mx = Math.abs(it.w * sx - W) / 2, my = Math.abs(it.h * sy - H) / 2;
  it.panX = Math.max(-mx, Math.min(mx, it.panX));
  it.panY = Math.max(-my, Math.min(my, it.panY));
}

function orient(ctx, it) {
  if (it.rot) ctx.rotate(Math.PI);
  if (it.flip) ctx.scale(-1, 1);
}

function drawFrame(ctx, it, fi) {
  const bmp = it.frames[fi].bmp, sw = bmp.width, sh = bmp.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = it.bgColor;
  ctx.fillRect(0, 0, W, H);
  if (it.fit === "contain" && it.bg === "blur") {
    const s = Math.max(W / sw, H / sh) * 1.15;
    ctx.translate(W / 2, H / 2); orient(ctx, it);
    ctx.filter = "blur(8px) brightness(0.55) saturate(1.2)";
    ctx.drawImage(bmp, -sw * s / 2, -sh * s / 2, sw * s, sh * s);
    ctx.filter = "none";
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  const [sx, sy] = scales(it);
  ctx.translate(W / 2 + it.panX, H / 2 + it.panY); orient(ctx, it);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(bmp, -sw * sx / 2, -sh * sy / 2, sw * sx, sh * sy);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// RGB888 -> RGB565 big-endian. Optionally writes the quantized color back for preview.
function to565(img, out, preview) {
  const d = img.data;
  for (let i = 0, p = 0; i < d.length; i += 4, p += 2) {
    const r = d[i] >> 3, g = d[i + 1] >> 2, b = d[i + 2] >> 3;
    if (out) { const v = (r << 11) | (g << 5) | b; out[p] = v >> 8; out[p + 1] = v & 0xFF; }
    if (preview) { d[i] = (r << 3) | (r >> 2); d[i + 1] = (g << 2) | (g >> 4); d[i + 2] = (b << 3) | (b >> 2); d[i + 3] = 255; }
  }
}

function renderTo(ctx, it, fi) {
  drawFrame(wctx, it, fi);
  const img = wctx.getImageData(0, 0, W, H);
  if (model.preview === "rgb565") to565(img, null, true);
  ctx.putImageData(img, 0, 0);
}

// What the preview plays: the selected item alone, or the whole queue.
function playlist() {
  if (state.full) return state.seq;
  const it = current();
  return it ? it.sel.map(fi => ({ it, fi })) : [];
}

let playPos = 0, lastSwap = 0, dirty = true;
function tick(tm) {
  requestAnimationFrame(tick);
  const list = playlist();
  if (!list.length) return;
  if (tm - lastSwap >= state.interval) {
    playPos = (playPos + 1) % list.length;
    lastSwap = tm; dirty = true;
  }
  if (!dirty) return;
  dirty = false;
  if (playPos >= list.length) playPos = 0;
  renderTo(sctx, list[playPos].it, list[playPos].fi);
  if (state.full) {
    const thumbs = $("strip").children;
    for (let i = 0; i < thumbs.length; i++) thumbs[i].classList.toggle("cur", i === playPos);
  }
}
requestAnimationFrame(tick);

let thumbTimer = null;
function renderThumbs() {
  clearTimeout(thumbTimer);
  thumbTimer = setTimeout(() => {
    const strip = $("strip"), seq = state.seq;
    while (strip.children.length > seq.length) strip.lastChild.remove();
    while (strip.children.length < seq.length) {
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      strip.appendChild(c);
    }
    seq.forEach(({ it, fi }, i) => {
      const c = strip.children[i];
      c.dataset.id = it.id;
      c.classList.toggle("mine", it.id === state.selId);
      c.classList.toggle("over", i >= MAX_FRAMES);
      c.classList.remove("cur");
      renderTo(c.getContext("2d"), it, fi);
    });
    for (const row of $("queue").querySelectorAll(".qitem")) {
      const it = state.queue.find(x => x.id === +row.dataset.id);
      if (it) renderTo(row.querySelector("canvas").getContext("2d"), it, it.sel[0] ?? 0);
    }
  }, 100);
}

// ---------- UI ----------
function $(id) { return document.getElementById(id); }

let statusMsg = { key: "statusIdle", p: {}, kind: "" };
function setStatus(key, p = {}, kind = "") { statusMsg = { key, p, kind }; renderStatus(); }
function renderStatus() {
  const s = $("status");
  s.textContent = t(statusMsg.key, statusMsg.p);
  s.className = "status" + (statusMsg.kind ? " " + statusMsg.kind : "");
}

function updateConn() {
  const on = isConnected();
  $("connPill").classList.toggle("on", on);
  $("connText").textContent = t(on ? "connected" : "disconnected", { name: model.name });
  $("connectBtn").classList.toggle("hide", on || hw.mode === "local");
  // Warn about apps that fight over the HID interface.
  if (on && hw.conflicts.length && !state.busy) {
    setStatus("conflict", { apps: hw.conflicts.join(t("and")) }, "warn");
  } else if (statusMsg.key === "conflict" && !hw.conflicts.length) {
    setStatus("statusIdle");
  }
  updateSend();
}

function updateSend() {
  const n = state.seq.length;
  $("sendBtn").disabled = !isConnected() || !n || n > MAX_FRAMES || state.busy;
}

function fmtSecs(s) {
  return s < 60 ? t("secs", { s: Math.ceil(s) }) : t("mins", { m: Math.floor(s / 60), s: Math.round(s % 60) });
}
const fmtDur = ms => ms >= 1000 ? `${(ms / 1000).toFixed(ms % 1000 ? 1 : 0)} s` : `${ms} ms`;

function itemSub(it) {
  if (it.kind === "gif") return t("gifSub", { n: it.sel.length });
  return t("imgSub", { d: fmtDur(it.sel.length * state.interval), n: it.sel.length });
}

// Rebuild the queue list (items added, removed or reordered, or language changed).
function structureChanged() {
  const q = $("queue");
  q.innerHTML = "";
  if (!state.queue.length) {
    const e = document.createElement("div");
    e.className = "qempty"; e.textContent = t("empty");
    q.appendChild(e);
  }
  state.queue.forEach((it, i) => {
    const row = document.createElement("div");
    row.className = "qitem";
    row.dataset.id = it.id;
    row.innerHTML = `<canvas width="${W}" height="${H}"></canvas>
      <div style="min-width:0"><div class="name"></div><div class="sub"></div></div>
      <div class="acts">
        <button data-act="up">↑</button>
        <button data-act="down">↓</button>
        <button data-act="del">✕</button>
      </div>`;
    row.querySelector(".name").textContent = `${i + 1}. ${it.name}`;
    row.querySelector('[data-act="up"]').title = t("up");
    row.querySelector('[data-act="down"]').title = t("down");
    row.querySelector('[data-act="del"]').title = t("remove");
    q.appendChild(row);
  });
  $("drop").classList.toggle("hide", state.queue.length > 0);
  if (!current()) state.selId = state.queue[0]?.id ?? null;
  syncEditor();
  changed();
}

$("queue").addEventListener("click", e => {
  const row = e.target.closest(".qitem"); if (!row) return;
  const id = +row.dataset.id, i = state.queue.findIndex(it => it.id === id);
  const act = e.target.closest("button")?.dataset.act;
  if (act === "del") {
    state.queue.splice(i, 1)[0].frames.forEach(f => f.bmp.close?.());
    if (state.selId === id) state.selId = state.queue[Math.min(i, state.queue.length - 1)]?.id ?? null;
  } else if (act === "up" && i > 0) {
    [state.queue[i - 1], state.queue[i]] = [state.queue[i], state.queue[i - 1]];
  } else if (act === "down" && i < state.queue.length - 1) {
    [state.queue[i + 1], state.queue[i]] = [state.queue[i], state.queue[i + 1]];
  } else if (!act) {
    state.selId = id;
  }
  structureChanged();
});

$("strip").addEventListener("click", e => {
  const c = e.target.closest("canvas"); if (!c) return;
  state.selId = +c.dataset.id;
  state.full = false; $("fullBtn").classList.remove("on");
  structureChanged();
});

// Sync editor controls from the selected item.
function syncEditor() {
  const it = current();
  $("editCard").classList.toggle("disabled", !it);
  if (!it) return;
  for (const b of $("fitSeg").children) b.classList.toggle("on", b.dataset.v === it.fit);
  for (const b of $("bgSeg").children) b.classList.toggle("on", b.dataset.v === it.bg);
  $("bgColor").value = it.bgColor;
  $("zoom").value = Math.round(it.zoom * 100);
  $("flipBtn").classList.toggle("on", it.flip);
  $("rotBtn").classList.toggle("on", it.rot);
  $("gifCtl").classList.toggle("hide", it.kind !== "gif");
  $("imgCtl").classList.toggle("hide", it.kind !== "image");
  $("count").max = Math.min(MAX_FRAMES, it.frames.length);
  $("count").value = it.count;
  $("trimA").value = it.trimA; $("trimB").value = it.trimB;
  $("hold").value = it.hold;
  playPos = 0;
}

function changed() {
  const it = current();
  if (it) clampPan(it);
  recompute();
  const n = state.seq.length, over = n > MAX_FRAMES;

  for (const row of $("queue").querySelectorAll(".qitem")) {
    const x = state.queue.find(q => q.id === +row.dataset.id);
    row.classList.toggle("sel", x.id === state.selId);
    row.querySelector(".sub").textContent = itemSub(x);
  }
  $("budget").classList.toggle("over", over);
  $("budgetVal").textContent = `${n} / ${MAX_FRAMES}`;
  $("budgetFill").style.width = `${Math.min(100, n / MAX_FRAMES * 100)}%`;
  $("interval").value = state.interval;
  $("interval").disabled = state.autoIv;
  $("autoIv").checked = state.autoIv;
  const mixed = state.queue.some(q => q.kind === "gif") && state.queue.some(q => q.kind === "image");
  $("ivNote").textContent = t(over ? "ivOver" : mixed ? "ivMixed" : "ivNote", { max: MAX_FRAMES });
  $("ivNote").classList.toggle("err", over);
  $("stripCount").textContent = n ? t("nFrames", { n }) : "";

  if (it) {
    $("zoomVal").textContent = `${Math.round(it.zoom * 100)}%`;
    $("bgRow").classList.toggle("hide", it.fit !== "contain");
    $("bgColor").classList.toggle("hide", it.bg !== "color");
    if (it.kind === "gif") {
      $("countVal").textContent = t("of", { a: it.sel.length, b: Math.min(MAX_FRAMES, it.frames.length) });
      const [a, b] = trimRange(it);
      $("trimVal").textContent = `${(a / 1000).toFixed(2)}–${(b / 1000).toFixed(2)} s`;
      $("trimFill").style.left = `${it.trimA / 10}%`;
      $("trimFill").style.width = `${(it.trimB - it.trimA) / 10}%`;
    } else {
      const real = it.sel.length * state.interval;
      $("holdVal").textContent = `${it.hold} s` + (real !== it.hold * 1000 ? ` (${t("approx", { d: fmtDur(real) })})` : "");
    }
  }

  $("sumFrames").textContent = n || "—";
  $("sumIv").textContent = n ? fmtDur(state.interval) : "—";
  $("sumLoop").textContent = n ? fmtDur(n * state.interval) : "—";
  $("sumEta").textContent = n ? fmtSecs(2 + Math.min(n, MAX_FRAMES) * SECONDS_PER_FRAME) : "—";
  $("screenBox").classList.toggle("full", state.full);
  dirty = true;
  renderThumbs();
  updateSend();
}

// Editor controls -> selected item
function edit(fn) { const it = current(); if (it) { fn(it); changed(); } }

function segment(id, key) {
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    for (const x of $(id).children) x.classList.toggle("on", x === b);
    edit(it => { it[key] = b.dataset.v; if (key === "fit") it.panX = it.panY = 0; });
  });
}
segment("fitSeg", "fit");
segment("bgSeg", "bg");

$("bgColor").addEventListener("input", e => edit(it => it.bgColor = e.target.value));
$("zoom").addEventListener("input", e => edit(it => it.zoom = e.target.value / 100));
$("flipBtn").addEventListener("click", e => edit(it => { it.flip = !it.flip; e.target.classList.toggle("on", it.flip); }));
$("rotBtn").addEventListener("click", e => edit(it => { it.rot = !it.rot; e.target.classList.toggle("on", it.rot); }));
$("centerBtn").addEventListener("click", () => edit(it => it.panX = it.panY = 0));
$("count").addEventListener("input", e => edit(it => it.count = +e.target.value));
$("trimA").addEventListener("input", e => edit(it => { it.trimA = Math.min(+e.target.value, it.trimB - 10); e.target.value = it.trimA; }));
$("trimB").addEventListener("input", e => edit(it => { it.trimB = Math.max(+e.target.value, it.trimA + 10); e.target.value = it.trimB; }));
$("hold").addEventListener("input", e => edit(it => it.hold = +e.target.value));

$("autoIv").addEventListener("change", e => { state.autoIv = e.target.checked; changed(); });
$("interval").addEventListener("input", e => {
  const v = Math.round(+e.target.value);
  if (v >= MIN_IV && v <= MAX_IV) { state.interval = v; changed(); }
});
$("fullBtn").addEventListener("click", e => {
  state.full = !state.full; e.target.classList.toggle("on", state.full); playPos = 0; changed();
});

// Files
$("addBtn").addEventListener("click", () => $("fileInput").click());
$("drop").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
window.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dragover"); });
window.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dragover"); });
window.addEventListener("drop", e => {
  e.preventDefault(); document.body.classList.remove("dragover");
  addFiles(e.dataTransfer.files);
});

// Pan / zoom on the preview (selected item)
let drag = null;
function leaveFull() {
  if (state.full) { state.full = false; $("fullBtn").classList.remove("on"); }
}
screen.addEventListener("pointerdown", e => {
  const it = current(); if (!it) return;
  leaveFull();
  drag = { x: e.clientX, y: e.clientY, px: it.panX, py: it.panY };
  screen.setPointerCapture(e.pointerId); screen.classList.add("dragging");
});
screen.addEventListener("pointermove", e => {
  if (!drag) return;
  const k = W / screen.getBoundingClientRect().width;
  edit(it => { it.panX = drag.px + (e.clientX - drag.x) * k; it.panY = drag.py + (e.clientY - drag.y) * k; });
});
screen.addEventListener("pointerup", () => { drag = null; screen.classList.remove("dragging"); });
screen.addEventListener("wheel", e => {
  if (!current()) return;
  e.preventDefault();
  leaveFull();
  edit(it => { it.zoom = Math.max(0.5, Math.min(4, it.zoom * Math.exp(-e.deltaY * 0.0015))); $("zoom").value = Math.round(it.zoom * 100); });
}, { passive: false });
screen.addEventListener("dblclick", () => edit(it => { it.panX = it.panY = 0; it.zoom = 1; $("zoom").value = 100; }));

// ---------- Upload ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function uploadWebHID(blob, n, interval, onProgress) {
  setStatus("talking");
  await xfer(packet(CMD.BEGIN));
  await xfer(packet(CMD.CFG_READ, 1, 0));
  const base = new Uint8Array(48);
  for (let a = 0; a < 48; a += 4) base.set((await xfer(packet(CMD.CFG_READ, 4, a))).subarray(4, 8), a);
  await xfer(packet(CMD.BEGIN));
  await xfer(packet(CMD.CFG_WRITE, 48, 0, buildConfig(base, n, interval)));
  await xfer(packet(CMD.END));
  onProgress(0, 0);
  await xfer(packet(CMD.PREPARE), 60000);
  const total = Math.ceil(blob.length / CHUNK);
  for (let i = 0; i < total; i++) {
    const addr = i * CHUNK;
    const chunk = blob.subarray(addr, Math.min(addr + CHUNK, blob.length));
    const p = packet(CMD.DATA, chunk.length, addr, chunk);
    const r = await xfer(p);
    for (let j = 0; j < 8; j++) if (r[j] !== p[j]) throw new Error(t("badAck", { i }));
    if (i === 0) await sleep(500); // the official tool pauses after the first chunk too
    if (i % 32 === 0 || i === total - 1) onProgress(i + 1, total);
  }
  await xfer(packet(CMD.END));
}

// WebHID payload: Shadow-S RGB565 big-endian frames, each padded to a 64 KB block.
function buildShadowBlob(seq) {
  const blob = new Uint8Array(seq.length * STRIDE);
  seq.forEach(({ it, fi }, k) => {
    drawFrame(wctx, it, fi);
    to565(wctx.getImageData(0, 0, W, H), blob.subarray(k * STRIDE, k * STRIDE + FRAME_BYTES), false);
  });
  return blob;
}

// Launcher payload: raw RGB888 frames; the model module encodes them for its keyboard.
function buildRgbBlob(seq) {
  const size = W * H * 3, blob = new Uint8Array(seq.length * size);
  seq.forEach(({ it, fi }, k) => {
    drawFrame(wctx, it, fi);
    const d = wctx.getImageData(0, 0, W, H).data;
    for (let i = 0, o = k * size; i < d.length; i += 4, o += 3) {
      blob[o] = d[i]; blob[o + 1] = d[i + 1]; blob[o + 2] = d[i + 2];
    }
  });
  return blob;
}

async function uploadLocal(blob, n, interval, onProgress) {
  const r = await fetch(`/api/upload?frames=${n}&interval=${interval}&model=${encodeURIComponent(model.id)}`, { method: "POST", body: blob });
  if (!r.ok) {
    let msg = String(r.status);
    try { msg = (await r.json()).error; } catch {}
    throw new Error(msg);
  }
  onProgress(0, 0);
  for (;;) {
    await sleep(300);
    const { job } = await fetchStatus();
    if (job.phase === "error") throw new Error(job.error);
    onProgress(job.done, job.total);
    if (job.phase === "done") return;
  }
}

$("sendBtn").addEventListener("click", async () => {
  const seq = state.seq.slice(), interval = state.interval, n = seq.length;
  if (!isConnected() || !n || n > MAX_FRAMES || state.busy) return;
  state.busy = true; updateSend();
  const bar = $("barFill");
  bar.style.width = "0%";
  const tClick = performance.now();
  let tData = 0;
  const onProgress = (done, total) => {
    if (!total) { setStatus("preparing"); return; }
    if (!tData) tData = performance.now();
    const frac = done / total, el = (performance.now() - tData) / 1000;
    bar.style.width = `${(frac * 100).toFixed(1)}%`;
    setStatus("sending", {
      i: Math.min(n, Math.floor(frac * n) + 1), n,
      eta: frac > 0.02 ? fmtSecs(el / frac - el) : fmtSecs(n * SECONDS_PER_FRAME),
    });
  };
  try {
    if (hw.mode === "local") await uploadLocal(buildRgbBlob(seq), n, interval, onProgress);
    else await uploadWebHID(buildShadowBlob(seq), n, interval, onProgress);
    bar.style.width = "100%";
    setStatus("done", { n, s: ((performance.now() - tClick) / 1000).toFixed(1) }, "ok");
  } catch (err) {
    setStatus("failed", { err: err.message }, "err");
    if (hw.mode === "webhid" && device) { try { await xfer(packet(CMD.END), 1000); } catch {} }
  } finally {
    state.busy = false; updateSend();
  }
});

// ---------- Boot ----------
(async () => {
  try {
    applyStatus(await fetchStatus());
    hw.mode = "local";
    setInterval(() => fetchStatus().then(applyStatus).catch(() => {}), 1000);
  } catch {
    hw.mode = "webhid";
    await connectWebHID(false);
  }
  hw.booted = true;
  applyI18n();
})();
renderModelInfo();
applyI18n();
</script>
